name: Release

# Song ngữ: Phát hành bản phát hành GitHub khi đẩy tag v* /
# Publish a GitHub Release when a v* tag is pushed (built by CI, not locally).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Phát hành / Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kiểm tra trước khi phát hành / Pre-release checks
        # Heredoc 'PY' (nháy đơn) KHONG expand bien shell — truyen tag qua env
        # thay vi "${GITHUB_REF_NAME}" trong ma Python / quoted 'PY' heredoc does
        # NOT expand shell variables — pass the tag via env instead of embedding
        # "${GITHUB_REF_NAME}" in the Python code (it would stay literal).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml
          data = yaml.safe_load(open("plugin.yaml", encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          print(f"tag={tag} plugin.yaml version={data.get('version')}")
          if tag != str(data.get("version")):
              sys.exit(f"::error::Tag v{tag} != plugin.yaml version {data.get('version')}")
          PY

      - name: Cài pytest / Install pytest
        run: python -m pip install --quiet pytest

      - name: Kiểm thử / Run tests
        run: python -m pytest -q

      - name: Đóng gói / Build package
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Tạo GitHub Release / Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hermes-plugin-remote-hosts ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
