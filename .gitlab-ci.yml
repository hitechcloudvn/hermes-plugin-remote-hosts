# Song ngữ: CI GitLab — kiểm thử mọi nhánh, phát hành khi có tag v* /
# GitLab CI — test on every branch, release on v* tags.
stages:
  - test
  - release

default:
  image: python:3.13-alpine

test:
  stage: test
  script:
    - pip install --quiet pytest
    - python -m pytest -q

# Tao GitLab Release khi co tag v* / create the GitLab Release on v* tags.
# Khong dung keyword `release:` — runner 19.6+ yeu cau glab/release-cli trong
# image chay job va embed mo ta markdown vao shell script (backtick bi thuc thi).
# Goi Releases API truc tiep qua .ci/create_gitlab_release.py — xem docstring.
# Not using the `release:` keyword — runner 19.6+ needs glab/release-cli inside
# the job image and embeds the markdown notes into shell code (backticks get
# executed). We call the Releases API directly via .ci/create_gitlab_release.py
# — see that file's docstring.
release:
  stage: release
  image: python:3.13-alpine
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - python -u .ci/create_gitlab_release.py
  # Giu release-response.json doc duoc ca khi loi / keep release-response.json
  # readable even if the call fails
  artifacts:
    when: always
    paths:
      - release-response.json
    expire_in: 30 days
